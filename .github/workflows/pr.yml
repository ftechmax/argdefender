name: Pull request

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Tests and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test ./ArgDefender.sln --configuration Release

      - name: Create package
        run: dotnet pack ./src/ArgDefender.csproj --configuration Release --no-build

  test-net11:
    name: Tests (.NET 11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Run tests
        run: dotnet test ./tests/ArgDefender.Test.csproj --configuration Release -p:TestTargetFramework=net11.0
